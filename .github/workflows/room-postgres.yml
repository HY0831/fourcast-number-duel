name: Playgrove Durable Rooms Integration
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/room-*'
      - 'package.json'
      - '.github/workflows/room-postgres.yml'
  push:
    paths:
      - 'server/**'
      - 'tests/room-*'
      - 'package.json'
      - '.github/workflows/room-postgres.yml'
permissions:
  contents: read
jobs:
  room-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playgrove_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: playgrove_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playgrove_ci -d playgrove_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Verify PostgreSQL process-restart recovery
        env:
          PLAYGROVE_TEST_DATABASE_URL: postgresql://playgrove_ci:local-test-only@127.0.0.1:5432/playgrove_ci
        run: node --test tests/room-postgres.integration.mjs
